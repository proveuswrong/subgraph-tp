name: Deploy Subgraph

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts --non-interactive

      - name: Generate subgraph types
        run: yarn codegen

      - name: Build subgraph
        run: yarn build

      - name: Deploy subgraph
        env:
          SUBGRAPH_AUTH_TOKEN: ${{ secrets.SUBGRAPH_AUTH_TOKEN }}
        run: |
          : "${SUBGRAPH_AUTH_TOKEN:?Set SUBGRAPH_AUTH_TOKEN to a Subgraph Studio deploy key}"
          yarn deploy --deploy-key "$SUBGRAPH_AUTH_TOKEN" --version-label "v${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
